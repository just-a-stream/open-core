[package]
name = "engine-core"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Sequenced state folding contracts for a deterministic, synchronous event engine"
documentation = "https://docs.rs/engine-core"
readme = "README.md"
keywords = ["engine", "event-sourcing", "state-machine", "deterministic", "reactor"]
categories = ["data-structures", "rust-patterns"]

[lints]
workspace = true

[features]
serde = ["dep:serde"]

[dependencies]
# Util
derive_more = { workspace = true, features = ["constructor", "display", "error"] }

# Serialisation
serde = { workspace = true, optional = true, features = ["derive"] }
